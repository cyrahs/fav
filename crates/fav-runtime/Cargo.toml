[package]
name = "fav-runtime"
description = "Scheduler, control-request queue, notifications and source registry for fav"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
chrono.workspace = true
chrono-tz.workspace = true
fav-core.workspace = true
fav-db.workspace = true
fav-net.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "signal", "sync", "time"] }

[dev-dependencies]
axum.workspace = true
fav-core = { workspace = true, features = ["test-support"] }
fav-db = { workspace = true, features = ["test-support"] }
tempfile = "3"
tokio = { workspace = true, features = ["net", "test-util"] }
