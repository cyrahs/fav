name: Dependabot auto-merge

# Unattended gallery-dl and yt-dlp upgrades. Dependabot opens the pull request,
# main's branch protection holds it until the `CI passed` check passes, and this
# enables auto-merge so no human has to be awake for it. Nothing here bypasses a
# check: if `CI passed` fails the pull request simply stays open.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  actions: write

# A Dependabot rebase (synchronize) restarts the wait below; without this the older
# run would also dispatch a build once the pull request merges.
concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    # `pull_request.user.login` rather than `github.actor`: a re-run is started by
    # whoever pressed the button, not the author.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Read Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Checked here as well as in dependabot.yml so that widening the allow list
      # later is a deliberate second decision rather than a silent side effect.
      # `dependency-names` is a comma-separated list, so a grouped pull request would
      # read "gallery-dl,yt-dlp" and match nothing here -- it stays open for a human,
      # which is the safe direction to fail in.
      - name: Enable auto-merge for the downloaders
        if: contains(fromJSON('["gallery-dl", "yt-dlp"]'), steps.metadata.outputs.dependency-names)
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The merge is made with GITHUB_TOKEN, and GitHub starts no workflow for events
      # that token causes: neither ci.yml's `push` nor this file's `pull_request: closed`
      # ever ran for an auto-merged downloader bump, so the new version only shipped with
      # the next human merge. workflow_dispatch is the one event GITHUB_TOKEN may start,
      # so this job waits for the merge itself and then asks for the build on main.
      - name: Wait for the merge and rebuild the image on main
        if: contains(fromJSON('["gallery-dl", "yt-dlp"]'), steps.metadata.outputs.dependency-names)
        run: |
          for _ in $(seq 1 60); do
            state="$(gh pr view "$PR_URL" --json state --jq .state)"
            case "$state" in
              MERGED)
                gh workflow run ci.yml \
                  --repo "$GITHUB_REPOSITORY" \
                  --ref main \
                  -f trigger-reason="dependabot: $PR_TITLE"
                exit 0
                ;;
              CLOSED)
                echo "Pull request was closed without merging; nothing to build."
                exit 0
                ;;
            esac
            sleep 30
          done
          # Not a failure: if CI failed the pull request stays open for a human, and a
          # human merge triggers ci.yml's `push` normally.
          echo "::notice::Pull request not merged after 30 minutes; no image rebuild dispatched."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
