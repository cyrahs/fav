name: Rust image

# Publishes the Rust build (rust/Dockerfile) for the direct production deployment Max
# approved on 2026-11-10. Only ever `ghcr.io/cyrahs/fav:rust-<short sha>`: never `latest`
# and never a semver tag, so the Flux policy that follows `latest` cannot pick it up.
# nas-gitops pins this image by tag and digest. ci.yml is untouched and still owns
# `latest` from main.

on:
  push:
    branches: [ rust ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/${{ github.repository }}
        flavor: |
          latest=false
        tags: |
          type=sha,prefix=rust-,format=short
        labels: |
          org.opencontainers.image.title=fav
          org.opencontainers.image.description=fav, Rust build

    - name: Refuse any tag but rust-<sha>
      env:
        TAGS: ${{ steps.meta.outputs.tags }}
      run: |
        printf '%s\n' "$TAGS"
        if printf '%s\n' "$TAGS" | grep -vE '^ghcr\.io/[^:]+:rust-[0-9a-f]{7,}$' | grep -q .; then
          echo "::error::unexpected image tag"
          exit 1
        fi

    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@v7
      with:
        context: .
        file: rust/Dockerfile
        platforms: linux/amd64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          FAV_GIT_COMMIT=${{ github.sha }}
          FAV_BUILD_TIME=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
        cache-from: type=gha,scope=rust-image
        cache-to: type=gha,mode=max,scope=rust-image

    - name: Report the pushed digest
      run: |
        echo "tags: ${{ steps.meta.outputs.tags }}" | tee -a "$GITHUB_STEP_SUMMARY"
        echo "digest: ${{ steps.build.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"
