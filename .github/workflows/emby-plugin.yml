name: Emby plugin

# The Huangguo Emby plugin (emby-plugin/), built on its own so that only a change to the
# plugin makes a new image: nas-gitops' Flux follows `latest`, and every new digest
# restarts Emby to copy the DLL in.
on:
  push:
    branches: [ main ]
    paths: [ 'emby-plugin/**', '.github/workflows/emby-plugin.yml' ]
  pull_request:
    branches: [ main ]
    paths: [ 'emby-plugin/**', '.github/workflows/emby-plugin.yml' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-emby-huangguo

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build (and on main, push `latest`)
      uses: docker/build-push-action@v7
      with:
        context: emby-plugin
        platforms: linux/amd64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        labels: |
          org.opencontainers.image.title=fav-emby-huangguo
          org.opencontainers.image.description=Huangguo metadata and images from fav, as an Emby plugin
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
        cache-from: type=gha,scope=emby-plugin
        cache-to: type=gha,mode=max,scope=emby-plugin,ignore-error=true
