name: CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      trigger-reason:
        description: 'Reason for manual trigger'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Format, clippy, the tests (none may be ignored) and the page smoke test, in one job
  # so they share one compile. Named `test`: main's branch protection requires `CI passed`
  # and Dependabot's auto-merge waits for it (dependabot-auto-merge.yml).
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tests
          POSTGRES_DB: fav-tests
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tests -d fav-tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CARGO_TERM_COLOR: always
      # Tests that need PostgreSQL create their own temporary database through this.
      FAV_TEST_DATABASE_URL: postgresql://tests@127.0.0.1:5432/fav-tests
      RUSTFLAGS: -D warnings

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Install the pinned toolchain (rust-toolchain.toml)
      run: |
        rustup toolchain install
        rustup show active-toolchain

    - uses: Swatinem/rust-cache@v2

    - name: Format
      run: cargo fmt --all -- --check

    - name: Clippy
      run: cargo clippy --workspace --all-targets --locked -- -D warnings

    - name: Locate Chromium for the CDP tests
      run: |
        chromium="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
        echo "FAV_TEST_CHROMIUM=${chromium}" >> "$GITHUB_ENV"
        "${chromium}" --version

    - name: Test (no test may be ignored)
      run: |
        set -o pipefail
        cargo test --workspace --locked 2>&1 | tee "$RUNNER_TEMP/cargo-test.log"
        if grep -E '^test result: .* [1-9][0-9]* ignored' "$RUNNER_TEMP/cargo-test.log"; then
          echo "::error::ignored tests are not allowed"
          exit 1
        fi

    - name: Build fav and the front end for the page smoke test
      run: |
        cargo build -p fav --locked
        cd web
        npm ci --no-audit --no-fund
        npm run build

    - name: Install uv
      uses: astral-sh/setup-uv@v9.0.0
      with:
        python-version: '3.12'

    - name: Page smoke test (React front end against the API)
      run: uv run tools/smoke/web_smoke.py

  # Validates the Dockerfile on every run without pushing anything, so it can run
  # in parallel with test instead of waiting behind it. Its layers land in
  # the GHA cache, which `publish` reuses.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/amd64
        push: false
        cache-from: type=gha,scope=image
        cache-to: type=gha,mode=max,scope=image

  # The only job that writes anywhere. Never runs on pull requests, and only
  # publishes after test and build have both passed.
  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [test, build]
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to Container Registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable={{is_default_branch}}
        labels: |
          org.opencontainers.image.title=fav
          org.opencontainers.image.description=Automation toolkit for collecting content from multiple sources

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        # The cluster's nodes are all amd64. An arm64 image would be built under
        # qemu on this amd64 runner, which took ~10 of the job's 10.5 minutes.
        platforms: linux/amd64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          FAV_GIT_COMMIT=${{ github.sha }}
          FAV_BUILD_TIME=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
        cache-from: type=gha,scope=image
        cache-to: type=gha,mode=max,scope=image

    - name: Log build trigger info
      if: inputs.trigger-reason
      run: |
        echo "Build triggered by: ${{ inputs.trigger-reason }}"

  # Single aggregate gate for branch protection: the ruleset requires only this
  # check, so jobs can be added or renamed above without touching repo settings.
  # `publish` is deliberately not listed -- it never runs on pull requests.
  ci-passed:
    name: CI passed
    if: always()
    runs-on: ubuntu-latest
    needs: [test, build]

    steps:
    - name: Fail if any job did not succeed
      if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
      run: exit 1
