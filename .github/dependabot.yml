version: 2

updates:
  # gallery-dl is the only dependency tracked here, and it is tracked because it is
  # the only one that breaks for reasons outside this repository: it follows X's
  # private API, so a release is usually the fix for X having changed something. The
  # sooner it lands the sooner the X source starts working again, which is why the
  # interval is daily and there is no cooldown. Everything else is bumped by hand.
  #
  # Merging is automated in .github/workflows/dependabot-auto-merge.yml, gated on the
  # `test` check that main's branch protection requires. Widening this allow list does
  # NOT widen what merges unattended -- that workflow checks the dependency name too.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "daily"
    allow:
      - dependency-name: "gallery-dl"
    commit-message:
      prefix: "deps"
