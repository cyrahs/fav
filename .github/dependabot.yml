version: 2

updates:
  # The two downloaders are tracked here because they are the dependencies that break
  # for reasons outside this repository: gallery-dl follows X's private API, yt-dlp
  # follows Bilibili's and Hanime1's, and in both cases a release is usually the fix
  # for the site having changed something. The sooner it lands the sooner the source
  # starts working again, which is why the interval is daily and there is no cooldown.
  # Everything else is bumped by hand.
  #
  # Xiaohongshu used to belong here through `xhshow`, which tracked its request
  # signing. It does not any more: that source reads the site through a real browser,
  # so there is no signature to keep up with.
  #
  # Merging is automated in .github/workflows/dependabot-auto-merge.yml, gated on the
  # `test` check that main's branch protection requires. Widening this allow list does
  # NOT widen what merges unattended -- that workflow checks the dependency name too.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "daily"
    allow:
      - dependency-name: "gallery-dl"
      - dependency-name: "yt-dlp"
    commit-message:
      prefix: "deps"
