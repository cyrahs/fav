[project]
name = "fav"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.0",
    "bilibili-api-python>=17.1.1",
    "colorlog>=6.9.0",
    "fastapi>=0.116.0",
    "gallery-dl>=1.32.9",
    "httpx>=0.28.1",
    "opencc-python-reimplemented>=0.1.7",
    "playwright>=1.59.0",
    "psycopg-pool>=3.2",
    "psycopg[binary]>=3.2.10",
    "pycryptodome>=3.21.0",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "telethon>=1.43.2",
    "tenacity>=8.5.0",
    "tqdm>=4.67.1",
    "uvicorn>=0.35.0",
    # Signs the Xiaohongshu web API (x-s / x-s-common / x-rap-param). Xiaohongshu
    # rotates that algorithm, so this is the dependency most likely to need an
    # upgrade before the source starts working again. See src/web/xiaohongshu.py.
    "xhshow>=0.2.0",
    # The [default] extra is required, not cosmetic: plain `yt-dlp` declares no
    # dependencies at all, leaving out pycryptodomex (encrypted HLS), websockets,
    # certifi, requests/urllib3 and yt-dlp-ejs. The standalone binary this replaced
    # bundled all of them, and Hanime1 downloads HLS. See tests/test_dependencies.py.
    "yt-dlp[default]>=2026.7.4",
]

[tool.ruff]
line-length = 140


[tool.ruff.lint]
select = ['ALL']
ignore = [
  'Q000',    # Double quotes
  'Q003',    # Incompatible with single-quote formatter
  'COM812',  # Trailing comma; conflicts with the formatter
  'PLC0414', # Import alias
  'D407', # Lines for docstrings
  'ANN401', # Any type
  'PERF203', # try-except in loop
  'D', # pydocstyle
  'PLW0603', # global variable
]

[tool.ruff.format]
quote-style = 'single'
indent-style = 'space'
line-ending = 'lf'

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
