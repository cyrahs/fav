[project]
name = "oracle-mcp"
version = "0.1.0"
description = "MCP server for operating the oracle host (redroid-1) through the LiteLLM gateway."
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.20,<2",
    "pillow>=11",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false
