<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Azur Lane Viewer Shell</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="https://cdn.jsdelivr.net/npm/pixi.js@8.18.1/dist/pixi.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@pixi/sound@6.0.1/dist/pixi-sound.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@hazart-pkg/live2d-core@1.0.1/live2dcubismcore.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/untitled-pixi-live2d-engine@1.1.0/dist/cubism.min.js" crossorigin="anonymous"></script>
    <script>
      var pixi_js = globalThis.PIXI;
    </script>
    <script src="https://cdn.jsdelivr.net/npm/pixi-v8-patch-spine@5.0.1/dist/pixi-v8-patch-spine.js" crossorigin="anonymous"></script>
    <script src="./stage-layout.js"></script>
    <script src="./live2d-loader.js"></script>
    <script src="./spine-runtime-compat.js"></script>
    <script src="./spine-loader.js"></script>
    <script src="./share-link.js"></script>
    <script src="./model-overrides.js"></script>
    <script src="./viewer-shell.js" defer></script>
    <script src="./model-catalog.js" defer></script>
  </head>
  <body>
    <main class="viewer-shell" aria-label="Azur Lane viewer shell">
      <div id="pixi-root" class="pixi-root"></div>
      <div id="viewer-controls" class="viewer-controls" data-controls-runtime="dom" aria-label="Viewer controls">
        <div class="viewer-toolbar">
          <span class="viewer-title">Azur Lane</span>
          <span class="viewer-state" id="viewer-state">Shell</span>
          <button id="share-link" class="viewer-tool-button" type="button" disabled>Share</button>
          <button id="reset-transform" class="reset-transform-button" type="button" disabled>Reset</button>
        </div>
        <div class="catalog-panel" id="catalog-panel">
          <div class="catalog-search-row">
            <label class="visually-hidden" for="catalog-search">Search models</label>
            <input id="catalog-search" class="catalog-search" type="search" autocomplete="off" spellcheck="false" placeholder="Search character or costume">
          </div>
          <div class="catalog-filter-row" aria-label="Model type filter">
            <button class="catalog-type-button is-active" type="button" data-model-type="all">All</button>
            <button class="catalog-type-button" type="button" data-model-type="live2d">Live2D</button>
            <button class="catalog-type-button" type="button" data-model-type="spine">Spine</button>
          </div>
          <div class="catalog-meta" id="catalog-meta">Loading catalog</div>
          <div class="catalog-list" id="catalog-list" role="listbox" aria-label="Model catalog"></div>
        </div>
      </div>
    </main>
  </body>
</html>
