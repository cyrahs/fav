[package]
name = "fav-net"
description = "HTTP client factory, streamed downloads and subprocess runner for fav"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bytes.workspace = true
chrono.workspace = true
fav-core.workspace = true
http.workspace = true
hyper.workspace = true
reqwest = { workspace = true, features = [
    "rustls-no-provider",
    "charset",
    "http2",
    "system-proxy",
    "json",
    "multipart",
    "cookies",
    "gzip",
    "deflate",
    "brotli",
    "socks",
] }
rustls.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "time", "rt"] }
url.workspace = true

[dev-dependencies]
axum.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "net"] }
