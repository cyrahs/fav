[package]
name = "fav-sources"
description = "One module per fav content source"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
fav-core.workspace = true
fav-db.workspace = true
fav-net.workspace = true
fav-runtime.workspace = true
fav-browser.workspace = true
aes.workspace = true
bytes.workspace = true
chrono.workspace = true
futures-util = { workspace = true, features = ["alloc"] }
# Bilibili: the ticket signature (HMAC-SHA256) and the refresh path (RSA-OAEP with SHA-256).
hmac = "0.13"
# Only to tell a body cut short from other read failures (`kit::HttpError::transport`).
hyper = { version = "1", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
regex.workspace = true
reqwest = { workspace = true, features = ["query", "stream"] }
rsa = "0.10"
serde_json.workspace = true
# hmac 0.13 and rsa 0.10 take digest 0.11, which the workspace's sha2 0.10 predates.
sha2 = "0.11"
sqlx.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["fs", "io-util", "time"] }
url.workspace = true
webp-animation = { workspace = true, features = ["static"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
axum.workspace = true
fav-core = { workspace = true, features = ["test-support"] }
fav-db = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "net", "rt", "io-util", "test-util"] }
url.workspace = true
http.workspace = true
sha2.workspace = true
