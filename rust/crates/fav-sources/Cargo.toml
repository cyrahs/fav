[package]
name = "fav-sources"
description = "One module per fav content source"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
fav-core.workspace = true
fav-db.workspace = true
fav-net.workspace = true
fav-runtime.workspace = true
fav-browser.workspace = true
aes.workspace = true
aes-gcm.workspace = true
blake2.workspace = true
bytes.workspace = true
chrono.workspace = true
flate2.workspace = true
futures-util = { workspace = true, features = ["alloc"] }
# Telegram (WP15): the MTProto client, its session trait and the raw `tl` types.
grammers-client.workspace = true
# Bilibili: the ticket signature (HMAC-SHA256) and the refresh path (RSA-OAEP with SHA-256).
hmac.workspace = true
# Tieba's form signature.
md-5.workspace = true
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
regex.workspace = true
fancy-regex.workspace = true
reqwest = { workspace = true, features = ["query", "stream"] }
rsa.workspace = true
serde_json.workspace = true
sha2.workspace = true
# SQLite for Telethon's `.session` files (WP15).
sqlx = { workspace = true, features = ["sqlite-bundled"] }
tempfile = "3"
# The queue owner token (`uuid4().hex`).
uuid = { version = "1", features = ["v4"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "process", "sync", "time"] }
unicode-normalization.workspace = true
url.workspace = true
webp-animation = { workspace = true, features = ["static"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
axum.workspace = true
# The fake web's HTTPS: a test authority and the `https://` sites it signs for.
rcgen.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
fav-core = { workspace = true, features = ["test-support"] }
fav-db = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "net", "rt", "io-util", "test-util"] }
url.workspace = true
http.workspace = true
