[package]
name = "fav-sources"
description = "One module per fav content source"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
fav-core.workspace = true
fav-db.workspace = true
fav-net.workspace = true
fav-runtime.workspace = true
fav-browser.workspace = true
futures-util.workspace = true
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
reqwest = { workspace = true, features = ["query", "stream"] }
sqlx.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["fs", "io-util", "time"] }
webp-animation = { workspace = true, features = ["static"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
axum.workspace = true
fav-core = { workspace = true, features = ["test-support"] }
fav-db = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["net", "test-util"] }
url.workspace = true
