# Which work package ports which Python tests. Read by rust/tools/parity/parity.py.
#
# Every Python test must match exactly one package. A pattern without `::` names a whole
# file; `file::test_*` (fnmatch) or `file::test_name` claims tests out of a file another
# package owns, because a more specific pattern wins. A package splitting a file adds
# the specific patterns here in its own PR.
#
# status: pending | in-progress | done. Set `done` in the PR that finishes the package;
# from then on CI requires every test in scope to be ported or waived.

