# The repository's ruff rules, plus what command-line scripts need.
extend = "../../pyproject.toml"

[lint]
extend-ignore = [
  "T201",    # these are CLI tools; print is their output
  "INP001",  # scripts, not an importable package
]

[lint.per-file-ignores]
# Same allowances the repository's own tests take in their file headers.
"tests/*" = ["S101", "ARG001", "PLR2004", "TC003", "SLF001"]
